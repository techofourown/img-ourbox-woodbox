name: Official Candidate Build & Publish (Woodbox)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'

permissions:
  contents: read
  packages: write

concurrency:
  group: official-candidate-woodbox
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: [self-hosted, official-heavy, x86-image]
    timeout-minutes: 120

    steps:
      - name: Fix workspace ownership from previous build
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build identity
        run: echo "OURBOX_VERSION=main-${GITHUB_SHA:0:12}" >> "${GITHUB_ENV}"

      - name: Bootstrap host dependencies
        run: sudo ./tools/bootstrap-host.sh

      - name: Install installer smoke dependencies
        run: |
          if command -v qemu-system-x86_64 >/dev/null 2>&1 \
            && command -v qemu-img >/dev/null 2>&1 \
            && command -v sshpass >/dev/null 2>&1 \
            && command -v nc >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils sshpass netcat-openbsd

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve current beta upstream input
        run: |
          set -euo pipefail
          source ./tools/approved-upstream-inputs.upstream.env
          python3 ./tools/release-control/release_control.py resolve-approved-upstream-input \
            --github-repo "${SW_OURBOX_OS_APPROVED_INPUTS_REPO}" \
            --github-ref "${SW_OURBOX_OS_APPROVED_INPUTS_REVISION}" \
            --github-path "${SW_OURBOX_OS_APPROVED_INPUTS_PATH}" \
            --artifact-key woodbox_ourbox_substrate \
            --channel-key candidate \
            --env-var OURBOX_SUBSTRATE_REF \
            --github-env "${GITHUB_ENV}"

      - name: Clean stale workspace artifacts
        run: |
          rm -rf artifacts/ deploy/
          rm -rf installer/ourbox/rootfs/opt/ourbox/substrate/platform/manifests
          rm -rf installer/ourbox/rootfs/opt/ourbox/substrate/platform/landing
          rm -rf installer/ourbox/rootfs/opt/ourbox/substrate/platform/todo-bloom

      - name: Preflight build host
        run: ./tools/preflight-build-host.sh

      - name: Fetch curated upstream inputs
        run: ./tools/fetch-ourbox-substrate.sh
        env:
          OURBOX_REQUIRE_PINNED_OFFICIAL_INPUTS: "1"

      - name: Build OS payload
        run: ./tools/build-os-payload.sh
        env:
          OURBOX_TARGET: x86
          OURBOX_VARIANT: prod

      - name: Publish OS artifact (official beta)
        run: ./tools/publish-os-artifact-official.sh beta

      - name: Build installer substrate ISO
        run: ./tools/build-installer-iso.sh
        env:
          OURBOX_TARGET: x86
          OURBOX_VARIANT: prod
          OURBOX_INSTALLER_SSH_MODE: both
          OURBOX_INSTALLER_SSH_USER: ourbox-installer
          OURBOX_INSTALLER_SSH_PASSWORD_HASH: ""
          OURBOX_INSTALLER_SSH_GENERATE_PASSWORD_IF_EMPTY: "1"
          OURBOX_INSTALLER_SSH_ALLOW_ROOT: "0"
          OURBOX_INSTALLER_SSH_AUTHORIZED_KEYS: ""

      - name: Smoke check baked installer-local defaults
        run: ./tools/check-installer-defaults-smoke.sh

      - name: Publish installer artifact (official beta)
        run: ./tools/publish-installer-artifact-official.sh beta

      - name: Build candidate provenance bundle
        run: |
          python3 ./tools/release-control/release_control.py build-candidate-provenance \
            --source-repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --candidate-workflow "${GITHUB_WORKFLOW}" \
            --candidate-run-id "${GITHUB_RUN_ID}" \
            --candidate-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --os-record deploy/os-artifact.publish.json \
            --installer-record deploy/installer-artifact.publish.json \
            --output deploy/candidate-provenance.json

      - name: Validate candidate provenance bundle
        run: |
          python3 ./tools/release-control/release_control.py validate-candidate-provenance \
            --input deploy/candidate-provenance.json \
            --expected-source-commit "${GITHUB_SHA}"

      - name: Upload provenance outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-candidate-${{ github.sha }}
          path: |
            deploy/os-artifact.ref
            deploy/os-artifact.pinned.ref
            deploy/os-artifact.digest
            deploy/os-artifact.meta.env
            deploy/os-artifact.meta.json
            deploy/os-artifact.publish.json
            deploy/installer-artifact.ref
            deploy/installer-artifact.pinned.ref
            deploy/installer-artifact.digest
            deploy/installer-artifact.meta.env
            deploy/installer-artifact.meta.json
            deploy/installer-artifact.publish.json
            deploy/candidate-provenance.json
            deploy/installer-defaults.extracted.env
            deploy/installer-defaults-smoke.txt
          if-no-files-found: error
