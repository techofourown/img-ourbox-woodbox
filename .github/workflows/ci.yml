name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanitization:
    name: Public repo sanitization check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden internal infrastructure details
        run: bash tools/check-public-sanitization.sh

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run shellcheck on build/publish scripts
        run: |
          shellcheck tools/*.sh
          shellcheck tools/release-control/*.sh

      - name: Run shellcheck on installer scripts
        run: |
          shellcheck installer/ourbox-preinstall/ourbox-preinstall
          shellcheck installer/ourbox-preinstall/ourbox-installer-ssh-bootstrap.sh
          shellcheck installer/ourbox-preinstall/format-data-disk.sh
          shellcheck installer/ourbox-preinstall/install-offline-target-packages.sh

      - name: Check shell syntax (bash -n)
        run: |
          for f in tools/*.sh; do
            bash -n "${f}" && echo "OK: ${f}"
          done
          for f in tools/release-control/*.sh; do
            bash -n "${f}" && echo "OK: ${f}"
          done
          bash -n installer/ourbox-preinstall/ourbox-preinstall && echo "OK: ourbox-preinstall"
          bash -n installer/ourbox-preinstall/ourbox-installer-ssh-bootstrap.sh && echo "OK: ourbox-installer-ssh-bootstrap.sh"
          bash -n installer/ourbox-preinstall/format-data-disk.sh && echo "OK: format-data-disk.sh"
          bash -n installer/ourbox-preinstall/install-offline-target-packages.sh && echo "OK: install-offline-target-packages.sh"

  installer-ssh-vendoring:
    name: Vendored installer SSH helper sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored installer SSH helper
        run: bash tools/check-vendored-installer-ssh-helper.sh

  release-control-vendoring:
    name: Vendored release-control sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored release-control module
        run: bash tools/check-vendored-release-control.sh

  release-control-smoke:
    name: Release-control smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release-control smoke test
        run: bash tools/check-release-control-smoke.sh

  os-publish-smoke:
    name: OS publish smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OS publish smoke test
        run: bash tools/check-publish-os-artifact-smoke.sh

  installer-publish-smoke:
    name: Installer publish smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer publish smoke test
        run: bash tools/check-publish-installer-artifact-smoke.sh

  installer-seed:
    name: Installer seed validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install seed validator dependencies
        run: sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Validate rendered installer seed
        run: bash tools/validate-installer-seed.sh

  offline-install-contract:
    name: Offline install contract smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate offline install contract
        run: bash tools/check-offline-install-contract-smoke.sh

  platform-contract-shape:
    name: Platform contract shape smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate platform contract capability guard
        run: bash tools/check-validate-platform-contract-shape-smoke.sh

  target-netplan-renderer:
    name: Target netplan renderer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target netplan renderer
        run: bash tools/check-render-target-netplan-smoke.sh

  installer-target-apt-repo:
    name: Installer target APT repo smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer target APT repo builder
        run: bash tools/check-prepare-installer-target-apt-repo-smoke.sh

  media-adapter-validation:
    name: Media adapter validation smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Woodbox media adapter contract
        run: bash tools/check-media-adapter-validation-smoke.sh

  flash-helper-smoke:
    name: Flash helper smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Woodbox flash helper
        run: bash tools/check-flash-installer-media-smoke.sh

  installer-ssh-bootstrap-smoke:
    name: Installer SSH bootstrap smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify installer SSH bootstrap service control
        run: bash tools/check-installer-ssh-bootstrap-smoke.sh

  installer-ssh-timeout-smoke:
    name: Installer SSH timeout smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify installer SSH timeout contract
        run: bash tools/check-installer-ssh-timeout-smoke.sh

  installer-ssh-log-leak-smoke:
    name: Installer SSH log leak smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify installer SSH leak detector
        run: bash tools/check-installer-ssh-log-leak-smoke.sh

  installer-cloud-init-gate-smoke:
    name: Installer cloud-init gate smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify installer cloud-init readiness gate
        run: bash tools/check-installer-cloud-init-gate-smoke.sh

  preinstall-provenance-smoke:
    name: Preinstall provenance smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Woodbox preinstall provenance helpers
        run: bash tools/check-preinstall-provenance-smoke.sh

  preinstall-mission-airgap-smoke:
    name: Preinstall mission airgap smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Woodbox preinstall mission airgap handling
        run: bash tools/check-preinstall-mission-airgap-smoke.sh

  preinstall-offline-helpers:
    name: Preinstall offline helper smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Woodbox offline helper generation
        run: bash tools/check-preinstall-offline-helpers-smoke.sh

  installed-target-ssh-helper:
    name: Installed-target SSH helper smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Woodbox installed-target SSH helper
        run: bash tools/check-installed-target-ssh-helper-smoke.sh

  mission-media-helper:
    name: Mission media helper smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify mission-media smoke helper
        run: bash tools/check-prepare-mission-media-smoke.sh

  fetch-airgap-platform:
    name: Fetch airgap platform smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify fetched airgap-platform bundle shape
        run: bash tools/check-fetch-airgap-platform-smoke.sh

  bootstrap-platform-profile:
    name: Bootstrap platform profile smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bootstrap profile contract
        run: bash tools/check-bootstrap-platform-profile-smoke.sh

  legacy-upstream-fallback-refs:
    name: Legacy upstream fallback refs smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify legacy upstream fallback refs
        run: bash tools/check-legacy-upstream-fallback-refs-smoke.sh

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional tinyexec@1.0.2

      - name: Lint PR commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to   ${{ github.event.pull_request.head.sha }} \
            --verbose

  workflow-safety:
    name: Workflow trust boundary check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check workflow trust boundaries
        run: bash tools/check-workflow-safety.sh

  pr-batch-big-picture:
    name: PR batch comparison tool tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PR batch comparison tool tests
        run: python3 tools/test_pr_batch_big_picture.py
